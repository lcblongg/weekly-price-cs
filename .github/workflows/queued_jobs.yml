name: Process admin queue
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-price-production
  cancel-in-progress: false
jobs:
  queue:
    if: vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check pending requests without installing scraper
        id: pending
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['SUPABASE_URL']
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          req=urllib.request.Request(base+'/rest/v1/automation_jobs?select=id&status=eq.pending&limit=1', headers={'apikey':key,'Authorization':'Bearer '+key})
          rows=json.load(urllib.request.urlopen(req,timeout=30))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('found='+str(bool(rows)).lower()+'\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.pending.outputs.found == 'true'
        with: {python-version: '3.12', cache: pip}
      - if: steps.pending.outputs.found == 'true'
        run: python -m pip install --require-hashes -r requirements.txt
      - if: steps.pending.outputs.found == 'true'
        run: python -m playwright install --with-deps chromium
      - if: steps.pending.outputs.found == 'true'
        run: python tools/cloud_worker.py --pending
      - uses: actions/upload-artifact@v4
        if: always() && steps.pending.outputs.found == 'true'
        with: {name: 'queue-${{ github.run_id }}', path: out/, retention-days: 14, if-no-files-found: warn}
