name: daily_prices
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      chains:
        description: 'Kênh (tgdd,cellphones,fpt,viettel,phongvu) hoặc all'
        type: string
        default: all
      send_report:
        description: 'Gửi Telegram (lượt theo lịch luôn gửi)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: weekly-price-production
  cancel-in-progress: false
jobs:
  pipeline:
    if: vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WEB_APP_URL: ${{ vars.WEB_APP_URL }}
      CHANNELS: ${{ inputs.chains || 'all' }}
      SEND_REPORT: ${{ github.event_name == 'schedule' || inputs.send_report }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - name: Run cloud pipeline
        run: |
          args=()
          if [ "$SEND_REPORT" = "true" ]; then args+=(--send-report); fi
          python tools/cloud_worker.py --kind daily_prices --chains "$CHANNELS" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'daily_prices-${{ github.run_id }}', path: out/, retention-days: 14, if-no-files-found: ignore}
